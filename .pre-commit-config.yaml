repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # TypeScript type check (core + cli)
  - repo: local
    hooks:
      - id: tsc
        name: TypeScript Build
        entry: bash -c 'exec pnpm -r build'
        language: system
        pass_filenames: false

  # ESLint (core + cli)
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bash -c 'exec pnpm -r lint'
        language: system
        pass_filenames: false

  # Tests (core + cli)
  - repo: local
    hooks:
      - id: tests
        name: Run Tests
        entry: bash -c 'exec pnpm -r test --run'
        language: system
        pass_filenames: false

  # Prettier (core + cli)
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: bash -c 'exec pnpm exec prettier --check .'
        language: system
        pass_filenames: false
